# Manual-only VPS release workflow. Pull requests are validated by
# .github/workflows/quality.yml; production deployment requires an explicit
# workflow_dispatch action from an authorized operator.
name: VPS production deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profas-vps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    env:
      # Build-time values or secrets if provided; production secrets never enter the CI build artifact.
      # NODE_ENV is intentionally NOT set here: `npm ci` treats an ambient
      # NODE_ENV=production as --omit=dev and silently skips devDependencies
      # (eslint, tailwindcss, jscpd, husky, ...), breaking lint/build/dup:check.
      # `npm run validate:env -- --production` forces production-mode checks via
      # its own --production flag, and `next build` sets production mode itself.
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://build:build@127.0.0.1:5432/build?connect_timeout=1' }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://build:build@127.0.0.1:5432/build?connect_timeout=1' }}
      JWT_SECRET: ci-only-jwt-secret-012345678901234567890123456789
      NEXT_PUBLIC_APP_URL: https://ci.invalid
      PRIVATE_UPLOAD_DIR: /app/.data/uploads
      HEALTHCHECK_TOKEN: ci-only-health-token-012345678901234567890
      REQUIRE_HEALTHCHECK_TOKEN: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate build environment
        run: npm run validate:env -- --production
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Performance budget
        run: npm run perf:budget
      - name: Smoke test
        run: npm run smoke

  deploy:
    name: Deploy to VPS
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate deployment secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$VPS_APP_DIR"
      - name: Deploy release over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT || '22' }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/profas_vps"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/profas_vps" "$HOME/.ssh/known_hosts"
          ssh -i "$HOME/.ssh/profas_vps" -p "$VPS_SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && DEPLOY_RELEASE_SHA='$RELEASE_SHA' VPS_APP_DIR='$VPS_APP_DIR' ./deploy/vps/deploy.sh"
